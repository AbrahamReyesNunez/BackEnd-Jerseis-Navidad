# =====================================================================
# Perfil "dev": valores para trabajar en TU ordenador.
# Se activa arrancando con:  .\mvnw spring-boot:run -Dspring-boot.run.profiles=dev
#
# Estos valores son de prueba. NUNCA los uses en el servidor real.
# =====================================================================

# PostgreSQL local (ver GUIA.md para instalarlo o levantarlo con Docker)
spring.datasource.url=jdbc:postgresql://localhost:5432/jerseys
spring.datasource.username=jerseys
spring.datasource.password=jerseys

# Claves de desarrollo (en producción se ponen con variables de entorno)
app.jwt.secreto=clave-de-desarrollo-solo-para-local-no-usar-en-produccion
app.hash.secreto=otra-clave-de-desarrollo-para-hash-de-ips-local

app.url-publica=http://localhost:8080

# Admin de desarrollo
app.admin.email=admin@jerseys.local
app.admin.password=admin12345

# Las fotos se guardan en una carpeta del proyecto y las sirve el propio Spring Boot
app.imagenes.almacen=local
app.imagenes.directorio-local=./imagenes-subidas

# Permite que el front, abierto con Live Server de VS Code, llame a la API
app.cors.origenes=http://localhost:5500,http://127.0.0.1:5500

# CAPTCHA desactivado en tu ordenador para poder registrarte desde Swagger sin más.
# Para probarlo de verdad, pon "activado=true" (necesita Internet). La clave de abajo es la
# CLAVE DE PRUEBA de Cloudflare: siempre aprueba el token de prueba "XXXX.DUMMY.TOKEN.XXXX",
# que es el que genera el widget del front con la sitekey de prueba 1x00000000000000000000AA.
app.captcha.activado=false
app.captcha.secreto=1x0000000000000000000000000000000AA

# Muestra en consola las consultas SQL que hace Hibernate (útil para aprender)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
