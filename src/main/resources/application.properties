# =====================================================================
# Configuración COMÚN a todos los entornos.
#
# Los valores ${VARIABLE} se leen de variables de entorno. Así los
# secretos (contraseñas, claves) NUNCA se escriben en el repositorio.
# En tu ordenador, los valores de desarrollo están en application-dev.properties.
# =====================================================================
spring.application.name=jerseys-backend

# ----- Base de datos -----
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USUARIO}
spring.datasource.password=${DB_PASSWORD}

# Hibernate NO crea ni modifica tablas: de eso se encarga Flyway.
# "validate" comprueba al arrancar que las entidades Java coinciden con las tablas.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# ----- Subida de archivos -----
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB

# ----- Detrás del túnel de Cloudflare (o de Nginx) -----
# Hace que request.getRemoteAddr() devuelva la IP real del visitante (la que llega en
# X-Forwarded-For) y no la del túnel. Solo se hace caso a esa cabecera si la petición viene
# de una IP interna (127.x, 172.16-31.x de Docker, 10.x, 192.168.x): desde Internet no se
# puede falsear, siempre que el puerto 8080 NO esté abierto al exterior.
server.forward-headers-strategy=native

# ----- Correo (SMTP) -----
# Servidor de correo para enviar los emails (verificación de cuenta, jersey retirado...).
# Ejemplos en GUIA.md (Gmail, Brevo...). Si MAIL_HOST está vacío, los correos NO se envían:
# se escriben en la consola. Eso solo se permite en desarrollo (ver app.correo.obligatorio).
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USUARIO:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.default-encoding=UTF-8
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
# Tiempo máximo (en milisegundos) para conectar y hablar con el servidor de correo.
# Sin esto, si el servidor no responde, el envío se quedaría esperando para siempre.
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# ----- Swagger / OpenAPI -----
# Apagado en producción: cualquiera vería la lista completa de la API. En el perfil dev está encendido.
springdoc.api-docs.enabled=${SWAGGER_ACTIVADO:false}
springdoc.swagger-ui.enabled=${SWAGGER_ACTIVADO:false}
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method

# =====================================================================
# Configuración propia de la aplicación (ver AppProperties.java)
# =====================================================================
# Clave para firmar los JWT. Mínimo 32 caracteres, aleatoria.
app.jwt.secreto=${JWT_SECRETO}
app.jwt.expiracion-horas=12

# Clave para calcular el hash de las IPs (HMAC). Mínimo 32 caracteres.
app.hash.secreto=${HASH_SECRETO}

# URL pública de la web (la que ve el usuario). Se usa en los enlaces de los correos.
app.url-publica=${URL_PUBLICA}

# Versión de la política de privacidad vigente. Cámbiala si cambia el texto.
app.privacidad.version-actual=v1

# Primer administrador: se crea al arrancar si todavía no existe ningún ADMIN.
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}
app.admin.nombre=Administrador

# Remitente de los correos. Si se deja vacío se usa MAIL_USUARIO (en Gmail TIENE que ser la misma cuenta).
app.correo.remitente=${MAIL_REMITENTE:}
# Nombre que verá la gente como remitente
app.correo.nombre-remitente=${MAIL_NOMBRE_REMITENTE:El hilo que nos une}
# true = la aplicación NO arranca si no hay servidor de correo. Así nadie despliega sin correo
# (sin él, nadie podría activar su cuenta). En desarrollo y en los tests vale false.
app.correo.obligatorio=${CORREO_OBLIGATORIO:true}
# Al avisar a TODOS (empieza la votación, se cierra, ganadores) se espera esto entre correo y correo.
# Los servidores de correo suelen limitar cuántos correos por hora se pueden mandar: con 2s salen
# como mucho 1.800 por hora. Si el del centro tiene un límite más bajo, súbelo.
app.correo.pausa-masivos=${CORREO_PAUSA_MASIVOS:2s}

# Orígenes permitidos por CORS (separados por comas). Vacío = ninguno.
# En producción no hace falta: el front y la API van en el mismo dominio (ver GUIA, "Despliegue").
app.cors.origenes=${CORS_ORIGENES:}

# ----- Imágenes -----
# "local" = una carpeta del disco, y el backend sirve las fotos en /imagenes/ (vuestro ordenador y el VPS)
# "ftp"   = otro servidor por FTP (solo si las fotos tuvieran que ir a otra máquina)
app.imagenes.almacen=${IMAGENES_ALMACEN:local}
# Ruta pública de las fotos
app.imagenes.url-base=/imagenes/
# En el VPS, una ruta que no se borre al recrear el contenedor (un volumen de Docker)
app.imagenes.directorio-local=${IMAGENES_DIRECTORIO:./imagenes-subidas}
app.imagenes.ftp.host=${FTP_HOST:}
app.imagenes.ftp.puerto=${FTP_PUERTO:21}
app.imagenes.ftp.usuario=${FTP_USUARIO:}
app.imagenes.ftp.password=${FTP_PASSWORD:}
app.imagenes.ftp.directorio=${FTP_DIRECTORIO:/imagenes}
# true = FTPS (FTP cifrado). Muy recomendable.
app.imagenes.ftp.ftps=${FTP_FTPS:true}

# ----- Límite de peticiones por IP (ver LimitadorPeticiones) -----
# Como máximo "capacidad" peticiones cada "periodo" desde la misma IP. Si se pasa: 429.
# OJO: en el instituto TODOS los alumnos salen a Internet con la MISMA IP pública.
# Por eso los valores son generosos: frenan a un script, no a una clase entera.
app.limites.login.capacidad=${LIMITE_LOGIN:30}
app.limites.login.periodo=1m
app.limites.registro.capacidad=${LIMITE_REGISTRO:30}
app.limites.registro.periodo=10m
app.limites.reenviar-verificacion.capacidad=${LIMITE_REENVIAR:10}
app.limites.reenviar-verificacion.periodo=10m
app.limites.recuperar-password.capacidad=${LIMITE_RECUPERAR:10}
app.limites.recuperar-password.periodo=10m

# ----- CAPTCHA del registro (Cloudflare Turnstile, ver VerificadorCaptcha) -----
# La clave SECRETA se saca del panel de Cloudflare (Turnstile → tu widget). La clave
# PÚBLICA (sitekey) no va aquí: la pone el front en su HTML.
app.captcha.activado=${CAPTCHA_ACTIVADO:true}
app.captcha.secreto=${TURNSTILE_SECRETO:}
