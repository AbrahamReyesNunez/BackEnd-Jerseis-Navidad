# Configuración para los tests. La base de datos la crea BaseDeDatosDePrueba (PostgreSQL embebido).
spring.datasource.url=jdbc:postgresql://no-se-usa
spring.datasource.username=no-se-usa
spring.datasource.password=no-se-usa

app.jwt.secreto=clave-de-tests-con-al-menos-treinta-y-dos-caracteres
app.hash.secreto=otra-clave-de-tests-con-al-menos-treinta-y-dos-chars
app.url-publica=http://localhost:8080
app.admin.email=admin@test.local
app.admin.password=admin12345
app.imagenes.almacen=local
app.imagenes.directorio-local=./target/imagenes-test

# Límite de login lento de rellenar (30 por hora = una ficha cada 2 minutos):
# así el test de "demasiados intentos" no depende de lo rápido que vaya el ordenador.
app.limites.login.capacidad=30
app.limites.login.periodo=1h

# Los tests no llaman a Cloudflare (irían lentos y fallarían sin Internet).
# VerificadorCaptchaTest prueba el CAPTCHA simulando las respuestas de Cloudflare.
app.captcha.activado=false

# Los tests no envían correos de verdad (CorreoServiceTest lo prueba con un servidor falso)
app.correo.obligatorio=false
